{% extends 'base.html' %}

{% block content %}
<h2>Dashboard</h2>

<!--options-->
<div class="d-flex justify-content-around my-4">
    <a href="{{ url_for('add_expense') }}" class="btn btn-primary">Add Expenses</a>
    <a href="{{ url_for('manage_expenses') }}" class="btn btn-secondary">Manage Expenses</a>
    <a href="{{ url_for('profile') }}" class="btn btn-info">User Profile</a>
</div>

<!--full expense report-->
<div class="mt-5">
    <h4>Full Expense Report</h4>
    <div class="row">
        <div class="col-md-6">
            <h5>Monthly Expenses</h5>
            <canvas id="monthlyExpenseChart"></canvas>
        </div>
        <div class="col-md-6">
            <h5>Expense by Category</h5>
            <canvas id="categoryExpenseChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // chart by minthly expenses
    var monthlyExpenseCtx = document.getElementById('monthlyExpenseChart').getContext('2d');
    var monthlyExpenseChart = new Chart(monthlyExpenseCtx, {
        type: 'line',
        data: {
            labels: {{ monthly_labels | tojson | safe }},
            datasets: [{
                label: 'Total Expenses (₹)',
                data: {{ monthly_data | tojson | safe }},
                borderColor: 'rgba(75, 192, 192, 1)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderWidth: 2,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Month'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Expenses (₹)'
                    },
                    beginAtZero: true
                }
            }
        }
    });

    // chart by category
    var categoryExpenseCtx = document.getElementById('categoryExpenseChart').getContext('2d');
    var categoryExpenseChart = new Chart(categoryExpenseCtx, {
        type: 'bar',
        data: {
            labels: {{ category_labels | tojson | safe }},
            datasets: [{
                label: 'Expense Amount (₹)',
                data: {{ category_data | tojson | safe }},
                backgroundColor: 'rgba(153, 102, 255, 0.5)',
                borderColor: 'rgba(153, 102, 255, 1)',
                borderWidth: 1
            }]
        }
    });
</script>
{% endblock %}
